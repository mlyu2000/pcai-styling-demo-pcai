# PCAI Styling Demo frontend — nginx config.
# The app shell (index.html) is versioned by image tag, so it must NEVER be
# cached by the browser: a stale index.html pins the user to an old UI build
# (old layout, wrong template location, inconsistent image sizes) even after
# a deploy. No-store the index; other static assets can be cached briefly.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # App shell: always revalidate, never serve a stale copy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Everything else (icons, future assets): short cache is fine.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "max-age=300";
    }
}
